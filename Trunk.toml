[[hooks]]
stage = "pre_build"
command = "npm"
command_arguments = ["run", "assets"]

[watch]
# Match both directories and their contents so generated assets cannot trigger builds.
ignore = [
    "assets/generated",
    "assets/generated/**",
    "assets/module.postcss",
    "assets/module.postcss/**",
    "node_modules",
    "node_modules/**",
]
