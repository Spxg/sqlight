[package]
name = "sqlight"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = [
    "crates/aceditor",
    "crates/floating-ui",
    "crates/istyles",
    "crates/split-grid",
]

[workspace.dependencies]
js-sys = "0.3.107"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-wasm-bindgen = "0.6.5"
syn = { version = "3.0.10", features = ["full"] }
thiserror = "2.0.21"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"

[dependencies]
istyles = { path = "crates/istyles" }
aceditor = { path = "crates/aceditor" }
split-grid = { path = "crates/split-grid" }
floating-ui = { path = "crates/floating-ui" }

console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.23", features = ["csr"] }
reactive_stores = "0.4.4"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
tokio = { version = "1.54.1", features = ["sync"] }
wasm-bindgen.workspace = true
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
console_log = "1.1.0"
log = "0.4.35"
send_wrapper = "0.6.0"
hex = "0.4.3"
prettytable-rs = { version = "0.10.0", default-features = false }
sqlformat = "0.5.0"

sqlite-wasm-vec = { version = "0.1.3", optional = true }
sqlite-wasm-vfs = { version = "0.3.0", features = ["sahpool"], optional = true }
sqlite-wasm-rs = { version = "0.6.3", default-features = false, features = ["wasm-bindgen"], optional = true }

[dependencies.web-sys]
workspace = true
features = [
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "CssStyleDeclaration",
    "DedicatedWorkerGlobalScope",
    "ErrorEvent",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "MediaQueryList",
    "Navigator",
    "ResizeObserver",
    "Storage",
    "Url",
    "UrlSearchParams",
    "Worker",
    "WorkerOptions",
    "WorkerType",
]

[features]
default = ["sqlite3"]
sqlite3 = ["dep:sqlite-wasm-rs", "dep:sqlite-wasm-vec", "dep:sqlite-wasm-vfs"]
sqlite3mc = ["sqlite3", "sqlite-wasm-rs/sqlite3mc"]

[[bin]]
name = "app"
path = "src/bin/app.rs"

[[bin]]
name = "sqlite3"
path = "src/bin/sqlite3.rs"
required-features = ["sqlite3"]

[[bin]]
name = "sqlite3mc"
path = "src/bin/sqlite3mc.rs"
required-features = ["sqlite3mc"]

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = "debuginfo"
